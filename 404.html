<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 迷失在樱花中</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07070b">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
            --accent:#ff8fb6;--accent-2:#ffc5d8;--accent-3:#ff6b9d;
            --ease:cubic-bezier(.22,.61,.36,1);
            --spring:cubic-bezier(.34,1.45,.5,1);
            --island-spring:cubic-bezier(0.175,0.885,0.32,1.15);
            --font-display:'Noto Serif JP','PingFang SC',serif;
            --font-body:'Noto Sans JP','PingFang SC',-apple-system,sans-serif;
            --font-mono:'JetBrains Mono',ui-monospace,monospace;
        }
        body{
            min-height:100vh;display:flex;flex-direction:column;align-items:center;
            background:#07070b;color:#fff8fc;overflow:hidden;
            font-family:var(--font-body);
            position:relative;
        }
        /* 背景光晕 (1:1 demo: orbFloat) */
        body::before{
            content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                radial-gradient(ellipse 60% 50% at 30% 40%,rgba(255,143,182,.08),transparent 60%),
                radial-gradient(ellipse 50% 40% at 70% 60%,rgba(196,78,255,.06),transparent 60%);
        }
        .orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;mix-blend-mode:screen}
        .orb-1{width:340px;height:340px;background:radial-gradient(circle,rgba(255,143,182,.14),transparent 70%);top:-8%;left:-10%;animation:orbFloat1 14s ease-in-out infinite}
        .orb-2{width:300px;height:300px;background:radial-gradient(circle,rgba(255,107,157,.10),transparent 70%);bottom:-8%;right:-10%;animation:orbFloat2 18s ease-in-out infinite reverse}
        @keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.1)}}
        @keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-40px) scale(.9)}}
        @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,25px) scale(1.08)}}

        /* 角标装饰 (1:1 demo) */
        .deco{position:fixed;z-index:0;pointer-events:none;opacity:.3}
        .deco-tl{top:18px;left:18px;width:54px;height:54px;
            border-top:2px solid var(--accent);border-left:2px solid var(--accent);border-radius:8px 0 0 0}
        .deco-br{bottom:18px;right:18px;width:54px;height:54px;
            border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);border-radius:0 0 8px 0}

        /* ===== 动态岛: 404 错误态 (1:1 demo: pill shape, red dot + mono text) ===== */
        .island-404{
            position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;
            display:flex;align-items:center;gap:8px;
            height:36px;padding:0 16px;border-radius:18px;
            background:#0c0c12;border:1px solid rgba(255,255,255,.1);
            box-shadow:0 12px 32px rgba(0,0,0,.55);
            animation:islandIn .7s var(--island-spring) both;
            transition:transform .35s var(--spring);
        }
        .island-404:hover{transform:translateX(-50%) scale(1.03)}
        .island-404-dot{
            width:5px;height:5px;border-radius:50%;background:#ff5f57;
            box-shadow:0 0 8px rgba(255,95,87,.8);
            animation:dotPulse 2.4s ease-in-out infinite;display:block;flex-shrink:0}
        .island-404-text{
            font-family:var(--font-mono);font-size:11px;font-weight:600;
            letter-spacing:.5px;color:rgba(255,255,255,.85);white-space:nowrap}
        @keyframes dotPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
        @keyframes islandIn{0%{opacity:0;transform:translateX(-50%) scale(.6)}60%{opacity:1;transform:translateX(-50%) scale(1.05)}100%{opacity:1;transform:translateX(-50%) scale(1)}}

        /* ===== 主内容 ===== */
        .wrap{
            position:relative;z-index:1;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            min-height:100vh;padding:40px;text-align:center;max-width:480px}
        /* 404 大字 (1:1 demo: serif, gradient, 126px) */
        .code{
            font-size:clamp(7rem,22vw,12rem);font-weight:900;line-height:1;
            font-family:var(--font-display);letter-spacing:-.04em;
            background:linear-gradient(135deg,#fff 0%,#ffd8e7 45%,#ff6b9d 100%);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent;
            margin-top:26px;
            animation:fadeUp .7s cubic-bezier(.34,1.2,.4,1) .1s both;
        }
        /* 渐变线 (1:1 demo) */
        .code-line{
            width:120px;height:2px;border-radius:2px;
            background:linear-gradient(90deg,transparent,var(--accent),transparent);
            margin-top:8px;
            animation:fadeUp .7s var(--ease) .18s both;
        }
        /* 标题 (1:1 demo: serif 19px) */
        .title{
            font-size:clamp(1.1rem,4vw,1.3rem);font-weight:700;color:#fff;
            font-family:var(--font-display);margin-top:22px;
            animation:fadeUp .7s var(--ease) .22s both;
        }
        /* 描述 (1:1 demo: 12.5px, #d885a2) */
        .desc{
            color:#d885a2;font-size:.85rem;line-height:1.8;margin-top:8px;
            animation:fadeUp .7s var(--ease) .3s both;
        }
        /* 按钮组 (1:1 demo: primary + secondary) */
        .btns{
            display:flex;gap:10px;margin-top:26px;
            animation:fadeUp .7s var(--ease) .4s both;
        }
        .btn-primary{
            display:inline-flex;align-items:center;gap:7px;
            padding:11px 26px;border-radius:16px;
            background:linear-gradient(120deg,var(--accent),var(--accent-3));
            color:#1a0610;font-weight:700;text-decoration:none;font-size:13px;
            box-shadow:0 8px 24px -8px rgba(255,143,182,.5);
            transition:transform .35s var(--spring),box-shadow .35s var(--ease);
        }
        .btn-primary:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 34px -8px rgba(255,143,182,.65)}
        .btn-primary:active{transform:translateY(-1px) scale(1.01)}
        .btn-primary svg{width:16px;height:16px;flex-shrink:0}
        .btn-secondary{
            display:inline-flex;align-items:center;
            padding:11px 22px;border-radius:16px;
            background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
            color:#fff;font-weight:600;text-decoration:none;font-size:13px;
            transition:background .3s var(--ease),transform .35s var(--spring);
        }
        .btn-secondary:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
        .btn-secondary:active{transform:translateY(0)}
        /* 终端回执 (1:1 demo: mono 9.5px) */
        .terminal{
            font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.5px;
            color:rgba(255,255,255,.28);margin-top:34px;
            animation:fadeUp .7s var(--ease) .5s both;
        }
        .terminal .cursor{
            display:inline-block;width:7px;height:13px;background:var(--accent);
            margin-left:3px;vertical-align:text-bottom;
            animation:cursorBlink 1s steps(1) infinite;
        }
        @keyframes cursorBlink{50%{opacity:0}}
        @keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}

        /* 飘落樱花瓣 */
        .petal{position:fixed;top:-20px;z-index:0;pointer-events:none;
            background:radial-gradient(circle at 30% 30%,rgba(255,200,220,.7),rgba(255,143,182,.3));
            border-radius:50% 0 50% 0;opacity:0;
            animation:petalFall linear infinite}
        .petal:nth-child(1){left:10%;width:10px;height:10px;animation-duration:9s;animation-delay:0s}
        .petal:nth-child(2){left:25%;width:14px;height:14px;animation-duration:12s;animation-delay:2s}
        .petal:nth-child(3){left:45%;width:8px;height:8px;animation-duration:10s;animation-delay:4s}
        .petal:nth-child(4){left:65%;width:12px;height:12px;animation-duration:14s;animation-delay:1s}
        .petal:nth-child(5){left:80%;width:9px;height:9px;animation-duration:11s;animation-delay:3s}
        .petal:nth-child(6){left:92%;width:11px;height:11px;animation-duration:13s;animation-delay:5s}
        @keyframes petalFall{
            0%{transform:translateY(0) rotate(0deg);opacity:0}
            10%{opacity:.5}
            90%{opacity:.4}
            100%{transform:translateY(105vh) rotate(360deg);opacity:0}
        }

        /* ===== 移动端 ===== */
        @media (max-width:768px){
            .island-404{top:14px;height:34px;padding:0 14px;border-radius:17px}
            .island-404-text{font-size:10px}
            .deco{width:40px;height:40px}
            .deco-tl{top:14px;left:14px}
            .deco-br{bottom:14px;right:14px}
            .btns{flex-direction:column;width:100%;max-width:260px}
            .btn-primary,.btn-secondary{justify-content:center;width:100%}
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="deco deco-tl"></div>
    <div class="deco deco-br"></div>

    <!-- 动态岛: 404 错误态 (1:1 demo: red dot + mono "404 · NOT FOUND") -->
    <div class="island-404">
        <span class="island-404-dot"></span>
        <span class="island-404-text">404 · NOT FOUND</span>
    </div>

    <div class="wrap">
        <div class="code">404</div>
        <div class="code-line"></div>
        <h1 class="title">迷失在樱花中</h1>
        <p class="desc">你寻找的页面不存在，可能已被移动或删除。<br>不如回到起点，重新出发。</p>
        <div class="btns">
            <a href="/" class="btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                返回首页
            </a>
            <a href="javascript:history.back()" class="btn-secondary">回上一页</a>
        </div>
        <div class="terminal">GET /you-are-lost → 404 · userhali.com<span class="cursor"></span></div>
    </div>

    <script>
        // 与主页一致的控制台彩蛋
        console.log('%c🌸 userhali.com','font-size:16px;font-weight:bold;color:#ff8fb6;');
        console.log('%c你迷路了吗？','font-size:12px;color:#d885a2;');
    </script>
</body>
</html>
