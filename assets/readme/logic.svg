<g transform="translate(58 449)" font-family="monospace" font-size="14"><circle cx="7" cy="-5" r="6" fill="#DB2777"/><text x="25" fill="#635A68">localStorage caches projects for 24h. A same-origin cookie stores autoplay preference for up to one year.</text></g></g></svg>