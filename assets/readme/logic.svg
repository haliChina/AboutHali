<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" overflow="hidden" role="img" aria-labelledby="t d"><title id="t">AboutHali runtime and privacy boundary</title><desc id="d">The origin serves native HTML, CSS, JavaScript, and WebGL while projects, statistics, fonts, media, avatars, and analytics rely on external services.</desc><rect width="1200" height="510" rx="24" fill="#F8F5F8"/><path d="M0 112H1200M0 414H1200" stroke="#DED6E0"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="51" fill="#A64F73" font-family="monospace" font-size="17">RUNTIME / NETWORK / STORAGE</text><text x="58" y="94" fill="#251D29" font-size="36" font-weight="800">Static origin, dynamic external content</text>
<g transform="translate(58 151)"><rect width="250" height="211" rx="15" fill="#FFFFFF" stroke="#DED6E0"/><text x="20" y="34" fill="#A64F73" font-family="monospace" font-size="15">ORIGIN</text><text x="20" y="72" fill="#251D29" font-size="22" font-weight="700">HTML · CSS · JS</text><text x="20" y="103" fill="#635A68" font-size="16">WebGL shader</text><text x="20" y="131" fill="#635A68" font-size="16">island state machine</text><text x="20" y="159" fill="#635A68" font-size="16">manifest + 404</text><rect x="20" y="177" width="158" height="23" rx="11.5" fill="#FCE7F3"/><text x="99" y="193" text-anchor="middle" fill="#9D174D" font-family="monospace" font-size="12">VERCEL STATIC</text></g><path d="M319 256H359M350 247L359 256L350 265" fill="none" stroke="#807487" stroke-width="2.5"/>
<g transform="translate(370 151)"><rect width="276" height="211" rx="15" fill="#211925"/><text x="20" y="34" fill="#F9A8D4" font-family="monospace" font-size="15">BROWSER RUNTIME</text><text x="20" y="72" fill="#FFFFFF" font-size="21" font-weight="700">CANVAS + AUDIO</text><text x="20" y="102" fill="#DDD2E1" font-size="16">adaptive render scale</text><text x="20" y="130" fill="#DDD2E1" font-size="16">visibility / battery pause</text><text x="20" y="158" fill="#DDD2E1" font-size="16">external link confirmation</text><text x="20" y="188" fill="#FBC7D8" font-family="monospace" font-size="13">NO SERVICE WORKER</text></g><path d="M657 256H697M688 247L697 256L688 265" fill="none" stroke="#807487" stroke-width="2.5"/>
